<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠퍼스 고객센터</title>
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>
<div class="app-shell">
    <main class="app-container" id="app-container">
        <section class="screen screen--login" id="login-screen" aria-labelledby="login-title">
            <div class="login-hero">
                <div class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="brand-icon__svg" focusable="false">
                        <path d="M20 11.5c0 4.14-3.58 7.5-8 7.5-1.07 0-2.1-.19-3.03-.53L5 20l1.24-3.32A7.1 7.1 0 0 1 4 11.5C4 7.36 7.58 4 12 4s8 3.36 8 7.5Zm-11-1.25a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm3 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm3 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"></path>
                    </svg>
                </div>
                <p class="eyebrow">Campus Support AI</p>
                <h1 id="login-title">캠퍼스 고객센터</h1>
                <p class="hero-copy">AI 상담으로 빠르게 문제를 해결하세요.</p>
            </div>

            <form id="login-form" class="login-card" novalidate>
                <div class="card-heading">
                    <h2>로그인</h2>
                </div>

                <div class="field-group">
                    <label class="field-label" for="login-username">사용자 이름</label>
                    <input
                        id="login-username"
                        name="username"
                        class="text-input"
                        type="text"
                        autocomplete="username"
                        placeholder="사용자 이름을 입력하세요"
                        required
                    >
                </div>

                <div class="field-group">
                    <label class="field-label" for="login-password">패스워드</label>
                    <input
                        id="login-password"
                        name="password"
                        class="text-input"
                        type="password"
                        autocomplete="current-password"
                        placeholder="패스워드를 입력하세요"
                        required
                    >
                </div>

                <p class="form-message" id="login-message" role="alert" aria-live="polite"></p>

                <button class="primary-button" id="login-button" type="submit">
                    <span class="button-label">로그인</span>
                    <svg aria-hidden="true" viewBox="0 0 24 24" class="button-icon button-icon--arrow" focusable="false">
                        <path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </button>
            </form>

            <p class="login-footer">대화 내용은 인증된 사용자별로 관리됩니다.</p>
        </section>

        <section class="screen screen--chat hidden" id="chat-screen" aria-labelledby="chat-title">
            <header class="chat-header">
                <div class="chat-header__brand">
                    <div class="header-avatar" aria-hidden="true">
                        <svg viewBox="0 0 24 24" class="brand-icon__svg" focusable="false">
                            <path d="M20 11.5c0 4.14-3.58 7.5-8 7.5-1.07 0-2.1-.19-3.03-.53L5 20l1.24-3.32A7.1 7.1 0 0 1 4 11.5C4 7.36 7.58 4 12 4s8 3.36 8 7.5Zm-11-1.25a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm3 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm3 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"></path>
                        </svg>
                        <span class="header-avatar__dot" aria-hidden="true"></span>
                    </div>
                    <div class="chat-header__titles">
                        <h1 id="chat-title">캠퍼스 고객센터</h1>
                        <div class="chat-header__subline">
                            <span class="status-pill">온라인</span>
                            <span class="status-separator" aria-hidden="true">·</span>
                            <span id="current-user-label" class="current-user-label"></span>
                        </div>
                    </div>
                </div>

                <button class="ghost-button" id="logout-button" type="button" aria-label="로그아웃">
                    <svg aria-hidden="true" viewBox="0 0 24 24" class="button-icon" focusable="false">
                        <path d="M10 17l1.5-1.5M15 12H4m0 0 3.5-3.5M4 12l3.5 3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        <path d="M14 5h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    <span>로그아웃</span>
                </button>
            </header>

            <div class="chat-banner" id="chat-banner" role="status" aria-live="polite" hidden></div>

            <section class="chat-scroll" id="chat-scroll" aria-labelledby="chat-title">
                <div class="empty-state" id="empty-state">
                    <div class="welcome-card">
                        <div class="welcome-card__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" class="brand-icon__svg" focusable="false">
                                <path d="M20 11.5c0 4.14-3.58 7.5-8 7.5-1.07 0-2.1-.19-3.03-.53L5 20l1.24-3.32A7.1 7.1 0 0 1 4 11.5C4 7.36 7.58 4 12 4s8 3.36 8 7.5Zm-11-1.25a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm3 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm3 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"></path>
                            </svg>
                        </div>
                        <p class="welcome-card__eyebrow">안녕하세요 👋</p>
                        <h2>캠퍼스 고객센터 AI 상담원입니다.</h2>
                        <p class="welcome-card__copy">무엇을 도와드릴까요? 아래 빠른 질문으로 바로 시작할 수 있습니다.</p>
                        <div class="quick-actions" aria-label="빠른 질문">
                            <button class="chip-button" type="button" data-prompt="주문 목록을 조회해줘">주문 목록 조회</button>
                            <button class="chip-button" type="button" data-prompt="반품 규정을 알려줘">반품 규정</button>
                        </div>
                    </div>
                </div>

                <div class="message-list" id="message-list" aria-live="polite"></div>
            </section>

            <form class="composer" id="composer-form" autocomplete="off">
                <div class="composer__field">
                    <label class="sr-only" for="chat-input">채팅 문장 입력</label>
                    <textarea
                        id="chat-input"
                        class="composer-input"
                        name="message"
                        rows="1"
                        placeholder="채팅 문장 입력"
                        aria-describedby="composer-help"
                    ></textarea>
                </div>
                <p id="composer-help" class="sr-only">Enter 키로 전송하고 Shift+Enter 키로 줄바꿈할 수 있습니다.</p>
                <button class="composer-button" id="composer-button" type="submit" aria-label="전송">
                    <svg aria-hidden="true" viewBox="0 0 24 24" class="button-icon button-icon--send" focusable="false">
                        <path d="M5 12l14-7-4 14-3-5-7-2Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    <span class="composer-button__text">전송</span>
                </button>
            </form>
        </section>
    </main>
</div>

<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="icon-chat" viewBox="0 0 24 24">
        <path d="M20 11.5c0 4.14-3.58 7.5-8 7.5-1.07 0-2.1-.19-3.03-.53L5 20l1.24-3.32A7.1 7.1 0 0 1 4 11.5C4 7.36 7.58 4 12 4s8 3.36 8 7.5Zm-11-1.25a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm3 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm3 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"></path>
    </symbol>
</svg>

<script src="js/chatbot.js" defer></script>
</body>
</html>
