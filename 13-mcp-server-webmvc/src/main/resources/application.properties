spring.application.name=demo

# MCP initialize 응답의 serverInfo 정보로 전달됩니다.
# 설정하지 않으면 기본값으로 name=mcp-server, version=1.0.0이 사용됩니다.
spring.ai.mcp.server.name=order-mcp-server
spring.ai.mcp.server.version=1.0.0

# HTTP 기반 MCP 서버를 Streamable HTTP 방식으로 동작시킵니다.
# 기본 MCP 엔드포인트(/mcp)가 생성되며, 현재 MCP에서 권장되는 HTTP Transport 방식입니다.
spring.ai.mcp.server.protocol=streamable