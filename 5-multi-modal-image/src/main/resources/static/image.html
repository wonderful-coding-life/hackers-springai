<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image API Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #202124;
      background: #f7f8fa;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 40px auto;
      padding: 28px;
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input[type="file"],
    textarea {
      width: 100%;
      border: 1px solid #c9d1d9;
      border-radius: 6px;
      background: #fff;
    }

    input[type="file"] {
      padding: 10px;
    }

    textarea {
      min-height: 120px;
      padding: 12px;
      resize: vertical;
    }

    button {
      width: fit-content;
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: #0969da;
      cursor: pointer;
    }

    button:disabled {
      background: #8c959f;
      cursor: wait;
    }

    .preview {
      display: none;
      max-width: 360px;
      max-height: 260px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      object-fit: contain;
    }

    .result {
      margin-top: 24px;
    }

    .result h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    pre {
      min-height: 120px;
      margin: 0;
      padding: 16px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
    }

    .error {
      color: #b42318;
    }
  </style>
</head>
<body>
  <main>
    <h1>/images API 테스트</h1>

    <form id="imageForm">
      <label>
        이미지 파일
        <input id="file" name="file" type="file" accept="image/*" required>
      </label>

      <img id="preview" class="preview" alt="선택한 이미지 미리보기">

      <label>
        메시지
        <textarea id="message" name="message" required>이 이미지에 대해 설명해 주세요.</textarea>
      </label>

      <button id="submitButton" type="submit">전송</button>
    </form>

    <section class="result" aria-live="polite">
      <h2>응답</h2>
      <pre id="result">아직 요청하지 않았습니다.</pre>
    </section>
  </main>

  <script>
    const form = document.getElementById("imageForm");
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");
    const submitButton = document.getElementById("submitButton");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) {
        preview.removeAttribute("src");
        preview.style.display = "none";
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      result.classList.remove("error");
      result.textContent = "요청 중입니다...";
      submitButton.disabled = true;

      try {
        const response = await fetch("/images", {
          method: "POST",
          body: new FormData(form)
        });

        const text = await response.text();

        if (!response.ok) {
          throw new Error(text || `HTTP ${response.status}`);
        }

        result.textContent = text;
      } catch (error) {
        result.classList.add("error");
        result.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
