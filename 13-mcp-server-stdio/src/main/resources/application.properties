spring.application.name=demo

# MCP initialize 응답의 serverInfo 정보로 전달됩니다.
# 설정하지 않으면 기본값으로 name=mcp-server, version=1.0.0이 사용됩니다.
spring.ai.mcp.server.name=datetime-mcp-server
spring.ai.mcp.server.version=1.0.0

# STDIO Transport를 활성화합니다.
# 기본값은 false이며, 설정하지 않으면 STDIO 서버가 시작되지 않습니다.
spring.ai.mcp.server.stdio=true

# STDIO 기반 MCP 서버는 stdout을 통해 JSON-RPC 메시지를 주고받습니다.
# 따라서 콘솔 로그가 출력되면 MCP 프로토콜 메시지와 섞여 통신 오류가 발생할 수 있습니다.
# 로그는 콘솔 대신 파일로 기록하는 것을 권장합니다.
logging.pattern.console=

# Spring Boot 배너 및 시작 로그를 비활성화합니다.
spring.main.banner-mode=off
spring.main.log-startup-info=false

# 애플리케이션 로그를 파일로 저장합니다.
logging.file.name=D:/hackers/workspace/datetime-mcp-server.log

